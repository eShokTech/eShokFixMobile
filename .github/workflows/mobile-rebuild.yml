name: eShokFix Mobile

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - '**'
      - '.github/workflows/mobile-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eshokfix-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Apply Dart analyzer fixes
        run: dart fix --apply

      - name: Commit analyzer fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test pubspec.lock
            git commit -m "style: apply Dart analyzer fixes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos

      - name: Tests
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eShokFix-Mobile-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
