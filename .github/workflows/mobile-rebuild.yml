name: eShokFix Mobile

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/mobile-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eshokfix-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Tests
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eShokFix-Mobile-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
