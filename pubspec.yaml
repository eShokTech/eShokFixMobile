name: eshokfix_mobile
description: eShokFix Mobile, reconstrucción móvil offline-first para operación de talleres.
publish_to: "none"
version: 0.0.1+3

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  local_auth: ^2.3.0
  material_ui: ^1.11.1
  mobile_scanner: ^7.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.6
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/eshokfix_logo.png
